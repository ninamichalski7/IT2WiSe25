<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Synth Garden – Viewer</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>
  <header>
    <nav>
      <div class="nav-container">
        <div class="nav-title">Synth Garden – Viewer</div>
        <ul class="nav-links">
		<li><a href="../index.html#experience">Zur Experience</a></li>
		<li><a href="../about.html">About</a></li>
		<li><a href="../controls.html">Controls</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main id="viewer">
    <div class="container">
      <h1>Stream anschauen</h1>

      <div class="controls-grid">
        <div class="control-block">
          <label for="hostPeerId">Host Peer-ID</label>
          <input id="hostPeerId" placeholder="z.B. 9f3k2..." />
          <button id="connectBtn">🔗 Verbinden</button>
          <p id="viewerStatus">Status: Nicht verbunden</p>
        </div>
      </div>

      <!-- Visual Bereich: wir nutzen IDs, die dein main.js auch kennt -->
      <section class="visual-section">
        <div id="particles"></div>

        <svg id="leafSVG" width="300" height="300" viewBox="0 0 300 300">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#8cffb3"></stop>
              <stop offset="100%" stop-color="#1e6b3a"></stop>
            </linearGradient>
          </defs>

          <g id="leafGroup">
            <path d="M150 40 C210 70 235 130 220 190 C200 255 150 270 150 270 C150 270 100 255 80 190 C65 130 90 70 150 40 Z"
                  fill="url(#g1)"></path>
            <path d="M150 55 C175 95 185 125 180 155 C170 205 150 230 150 230"
                  stroke="#ffffff66" stroke-width="3" fill="none"></path>
          </g>
        </svg>

      </section>

      <!-- Audio element für den empfangenen Stream -->
      <audio id="remoteAudio" autoplay playsinline></audio>
    </div>
  </main>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>

<script src="sketch.js"></script>
<script src="viewer.js"></script>

</body>
</html>
